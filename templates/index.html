<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CropPredict | Crop Recommendation System</title>

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            🌱 <span data-text="logo">CropPredict</span>
        </div>

        <div class="nav-text" data-text="navText">
            AI-Based Crop Recommendation
        </div>

    </nav>


    <!-- Main Section -->
    <main class="main-container">

        <!-- Heading -->
        <section class="hero">

            <h1 data-text="heroTitle">
                Find the Right Crop<br>
                for Your Conditions
            </h1>

            <p data-text="heroDescription">
                Enter your soil and environmental parameters
                to get an AI-powered crop recommendation.
            </p>

        </section>


        <!-- Prediction Card -->
        <section class="prediction-card">

            <div class="card-header">

                <h2 data-text="cardTitle">
                    Soil & Environmental Parameters
                </h2>

                <p data-text="cardDescription">
                    Provide the required values below
                </p>

            </div>


            <form action="/predict" method="POST">


                <!-- Language Selection -->
                <div class="language-section">

                    <label for="language" data-text="languageLabel">
                        Select Your Preferred Language
                    </label>

                    <select id="language" name="language" required>

                        <option value="english">
                            English
                        </option>

                        <option value="hindi">
                            हिंदी (Hindi)
                        </option>

                        <option value="kannada">
                            ಕನ್ನಡ (Kannada)
                        </option>

                    </select>

                </div>


                <!-- Row 1 -->
                <div class="input-row">

                    <div class="input-group">

                        <label for="nitrogen" data-text="nitrogenLabel">
                            Nitrogen (N)
                        </label>

                        <input
                            type="number"
                            id="nitrogen"
                            name="nitrogen"
                            step="any"
                            placeholder="Enter nitrogen value"
                            data-placeholder="nitrogenPlaceholder"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="phosphorus" data-text="phosphorusLabel">
                            Phosphorus (P)
                        </label>

                        <input
                            type="number"
                            id="phosphorus"
                            name="phosphorus"
                            step="any"
                            placeholder="Enter phosphorus value"
                            data-placeholder="phosphorusPlaceholder"
                            required
                        >

                    </div>

                </div>


                <!-- Row 2 -->
                <div class="input-row">

                    <div class="input-group">

                        <label for="potassium" data-text="potassiumLabel">
                            Potassium (K)
                        </label>

                        <input
                            type="number"
                            id="potassium"
                            name="potassium"
                            step="any"
                            placeholder="Enter potassium value"
                            data-placeholder="potassiumPlaceholder"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="temperature" data-text="temperatureLabel">
                            Temperature (°C)
                        </label>

                        <input
                            type="number"
                            id="temperature"
                            name="temperature"
                            step="any"
                            placeholder="Enter temperature"
                            data-placeholder="temperaturePlaceholder"
                            required
                        >

                    </div>

                </div>


                <!-- Row 3 -->
                <div class="input-row">

                    <div class="input-group">

                        <label for="humidity" data-text="humidityLabel">
                            Humidity (%)
                        </label>

                        <input
                            type="number"
                            id="humidity"
                            name="humidity"
                            step="any"
                            placeholder="Enter humidity"
                            data-placeholder="humidityPlaceholder"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="ph" data-text="phLabel">
                            Soil pH
                        </label>

                        <input
                            type="number"
                            id="ph"
                            name="ph"
                            step="any"
                            placeholder="Enter soil pH"
                            data-placeholder="phPlaceholder"
                            required
                        >

                    </div>

                </div>


                <!-- Row 4 -->
                <div class="input-group full-width">

                    <label for="rainfall" data-text="rainfallLabel">
                        Rainfall (mm)
                    </label>

                    <input
                        type="number"
                        id="rainfall"
                        name="rainfall"
                        step="any"
                        placeholder="Enter rainfall"
                        data-placeholder="rainfallPlaceholder"
                        required
                    >

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="predict-button"
                    data-text="predictButton">

                    🌱 Predict Crop

                </button>

            </form>

        </section>

    </main>


    <footer>

        <p data-text="footer">
            CropPredict • Machine Learning Based Crop Recommendation
        </p>

    </footer>

            }

        };


        function changeLanguage() {

            const language =
                document.getElementById("language").value;

            const text =
                translations[language];


            // Change text content
            document.querySelectorAll("[data-text]").forEach(element => {

                const key =
                    element.getAttribute("data-text");

                if (text[key]) {

                    element.innerHTML =
                        text[key];

                }

            });


            // Change input placeholders
            document.querySelectorAll("[data-placeholder]").forEach(element => {

                const key =
                    element.getAttribute("data-placeholder");

                if (text[key]) {

                    element.placeholder =
                        text[key];

                }

            });

        }


        // Run when the user selects a language
        document
            .getElementById("language")
            .addEventListener("change", changeLanguage);

    </script>

</body>

</html>
